# Infraestructura de la Red Social Distribuida
# Uso:  docker compose up -d        (levanta todos los servicios)
name: red-social

services:
  neo4j:
    image: neo4j:5-community
    container_name: redsocial-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser (HTTP) -> http://localhost:7474
      - "7687:7687" # Bolt (lo usa el driver del backend)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en el archivo .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Almacenamiento compatible con S3 (reemplaza a MinIO, que fue archivado en 2026)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: redsocial-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000" # API S3       -> http://localhost:9000
      - "9001:9001" # Consola web  -> http://localhost:9001
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY en el archivo .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Define S3_SECRET_KEY en el archivo .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data

  # --- Generación automática de llaves JWT (Persona D) ---
  jwt-keys:
    image: alpine:3
    container_name: redsocial-jwt-keys
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
      if [ ! -f /keys/privateKey.pem ]; then
      openssl genrsa -out /tmp/rsa.pem 2048 &&
      openssl pkcs8 -topk8 -nocrypt -inform pem -in /tmp/rsa.pem -outform pem -out /keys/privateKey.pem &&
      openssl rsa -pubout -in /tmp/rsa.pem -out /keys/publicKey.pem;
      fi"
    volumes:
      - jwt_keys:/keys

  # --- Backend Quarkus (Persona D) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: redsocial-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: posts-media
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      JWT_PUBLIC_KEY_PATH: file:/keys/publicKey.pem
      JWT_PRIVATE_KEY_PATH: file:/keys/privateKey.pem
    depends_on:
      neo4j:
        condition: service_healthy
      rustfs:
        condition: service_started
      jwt-keys:
        condition: service_completed_successfully
    volumes:
      - jwt_keys:/keys:ro

  # --- Frontend React (Persona D) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: redsocial-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  jwt_keys:
  neo4j_data:
  rustfs_data:
